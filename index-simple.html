<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accountability Tracker - Simple View</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #4a90e2, #7b68ee);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #4a90e2;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #e1e4e8;
        }

        th {
            background: #4a90e2;
            color: white;
            position: sticky;
            top: 0;
            font-weight: 600;
        }

        td.goal-name {
            text-align: left;
            font-weight: 500;
            background: #f8f9fa;
            position: sticky;
            left: 0;
            max-width: 300px;
        }

        td.strikes-0 { background: #d4edda; color: #155724; }
        td.strikes-1 { background: #fff3cd; color: #856404; }
        td.strikes-2 { background: #f8d7da; color: #721c24; }
        td.strikes-3 { background: #f5c6cb; color: #721c24; }
        td.strikes-high { background: #e74c3c; color: white; font-weight: bold; }

        .chart-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            height: 400px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Accountability Tracker - Weekly Strikes View</h1>
            <p style="margin-top: 10px; opacity: 0.9;">Simplified view showing strikes per goal per week</p>
        </header>

        <div class="stats" id="stats"></div>

        <div class="chart-container">
            <canvas id="trendChart"></canvas>
        </div>

        <div class="table-container">
            <h2 style="margin-bottom: 15px;">Weekly Strikes by Goal</h2>
            <div id="tableContainer"></div>
        </div>
    </div>

    <script>
        let data = null;
        let chart = null;

        // Load the condensed data
        fetch('condensed_data.json')
            .then(response => response.json())
            .then(loadedData => {
                data = loadedData;
                render();
            })
            .catch(error => {
                console.error('Error loading data:', error);
                document.body.innerHTML = '<div class="loading">Error loading data. Please make sure condensed_data.json is in the same folder.</div>';
            });

        function render() {
            renderStats();
            renderTable();
            renderChart();
        }

        function renderStats() {
            const totalWeeks = data.weeks.length;
            const totalGoals = data.goals.length;

            let totalStrikes = 0;
            let recentStrikes = 0;

            data.goals.forEach(goal => {
                totalStrikes += goal.strikes.reduce((a, b) => a + b, 0);
                recentStrikes += goal.strikes[goal.strikes.length - 1] || 0;
            });

            const avgStrikesPerWeek = (totalStrikes / totalWeeks).toFixed(1);

            const html = `
                <div class="stat-card">
                    <h3>Total Weeks</h3>
                    <div class="value">${totalWeeks}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Goals</h3>
                    <div class="value">${totalGoals}</div>
                </div>
                <div class="stat-card">
                    <h3>Avg Strikes/Week</h3>
                    <div class="value">${avgStrikesPerWeek}</div>
                </div>
                <div class="stat-card">
                    <h3>Recent Week Strikes</h3>
                    <div class="value">${recentStrikes}</div>
                </div>
            `;

            document.getElementById('stats').innerHTML = html;
        }

        function renderTable() {
            let html = '<table><thead><tr><th>Goal</th>';

            // Add week headers (show only last 12 weeks for readability)
            const recentWeeks = data.weeks.slice(-12);
            recentWeeks.forEach(week => {
                html += `<th>${week}</th>`;
            });
            html += '<th>Total</th></tr></thead><tbody>';

            // Add goal rows
            data.goals.forEach(goal => {
                // Skip if goal has no strikes ever
                const totalStrikes = goal.strikes.reduce((a, b) => a + b, 0);
                if (totalStrikes === 0) return;

                html += '<tr>';
                html += `<td class="goal-name">${goal.name}</td>`;

                // Show only recent weeks
                const recentStrikes = goal.strikes.slice(-12);
                recentStrikes.forEach(strikes => {
                    const className = strikes === 0 ? 'strikes-0' :
                                    strikes === 1 ? 'strikes-1' :
                                    strikes === 2 ? 'strikes-2' :
                                    strikes === 3 ? 'strikes-3' : 'strikes-high';
                    html += `<td class="${className}">${strikes || ''}</td>`;
                });

                html += `<td style="font-weight: bold; background: #e9ecef;">${totalStrikes}</td>`;
                html += '</tr>';
            });

            html += '</tbody></table>';
            document.getElementById('tableContainer').innerHTML = html;
        }

        function renderChart() {
            const ctx = document.getElementById('trendChart');

            // Calculate total strikes per week
            const weeklyTotals = data.weeks.map((week, weekIndex) => {
                return data.goals.reduce((sum, goal) => sum + (goal.strikes[weekIndex] || 0), 0);
            });

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.weeks,
                    datasets: [{
                        label: 'Total Strikes Per Week',
                        data: weeklyTotals,
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Strikes Over Time',
                            font: { size: 16 }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 5
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
